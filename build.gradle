plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
    accessWidenerPath = file("src/main/resources/nevaware.accesswidener")
}

repositories {
    maven { url = 'https://maven.meteordev.org/releases' }
    mavenCentral()
}

sourceSets {
    baritoneStub { java { srcDir 'stubs/baritone' } }
    main {
        java {
            // Dead leftover: not registered in nevaware.mixins.json and references
            // a class (features.models.CustomModelRenderer) that is not in the original jar.
            exclude '**/injection/MixinPlayerEntityRenderer.java'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Sources are in intermediary names (class_xxx); mappings are generated by tools/make_identity_mappings.py
    mappings files("mappings/identity-named.jar")
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "meteordevelopment:orbit:${project.orbit_version}"
    include "meteordevelopment:orbit:${project.orbit_version}"

    // Shaded in the original jar (not shipped by Minecraft)
    implementation "io.netty:netty-codec-socks:4.1.97.Final"
    include "io.netty:netty-codec-socks:4.1.97.Final"
    implementation "io.netty:netty-handler-proxy:4.1.97.Final"
    include "io.netty:netty-handler-proxy:4.1.97.Final"

    // Provided by Fabric Loader at runtime
    compileOnly "io.github.llamalad7:mixinextras-fabric:0.4.1"

    // Fabric API (ClientWorldEvents, rendering events); installed by the player at runtime
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Baritone API: compile-only stub (stubs/baritone). Real Baritone is optional at runtime.
    compileOnly sourceSets.baritoneStub.output
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ["-Xmaxerrs", "10000"]
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar { from('LICENSE') { rename { "${it}_${project.archivesBaseName}" } } }
