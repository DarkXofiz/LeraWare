plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.meteordev.org/releases' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Source is in intermediary names (class_xxx), so use intermediary as "mappings".
    mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "meteordevelopment:orbit:${project.orbit_version}"
    include "meteordevelopment:orbit:${project.orbit_version}"

    // Shaded in the original jar (not shipped by Minecraft)
    implementation "io.netty:netty-codec-socks:4.1.97.Final"
    include "io.netty:netty-codec-socks:4.1.97.Final"
    implementation "io.netty:netty-handler-proxy:4.1.97.Final"
    include "io.netty:netty-handler-proxy:4.1.97.Final"

    // Provided by Fabric Loader at runtime
    compileOnly "io.github.llamalad7:mixinextras-fabric:0.4.1"

    // Baritone API: place your baritone-api jar in libs/ (optional at runtime)
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar { from('LICENSE') { rename { "${it}_${project.archivesBaseName}" } } }
